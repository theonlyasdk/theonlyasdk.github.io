---
layout: page-notitle
icon: fas fa-code
order: 4
---
<style>
  /* Layout & Structure */
  .projects-page-content {
    width: 100%;
  }

  .flex-row {
    display: flex;
    flex-direction: row;
    align-items: center;
  }

  .flex-wrap {
    flex-wrap: wrap;
  }

  .d-none {
    scale: 0;
    visibility: hidden;
  }

  /* Top Bar & Search */
  .projects-top-bar {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .projects-top-bar-title {
    margin-top: 0;
  }

  .search-box-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    align-items: center;
    gap: .8em;
    justify-content: flex-start;
    margin-top: .8em;
    margin-bottom: 1em;
  }

  /* Project Cards */
  .project-card {
    background-color: var(--card-bg);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    text-align: left;
    padding: 0em 2em 0em 2em;
    width: 100%;
    margin-bottom: 1.2em;
    box-shadow: var(--card-shadow);
    border: 0;
    opacity: 0;
    overflow: hidden;
    animation: slideIn 2s var(--spring-ease) var(--anim-delay, 0s) forwards;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
  }

  .project-card:hover {
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.3);
  }

  @media (prefers-reduced-motion: reduce) {
    .project-card {
      transform: none !important;
      transition: none !important;
    }
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: scale(1.05);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .project-card>h1 {
    margin: 2rem 0 1rem;
  }

  .project-card-tags {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
  }

  .project-card-bottom {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }

  .projects-page-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    margin-top: 0;
  }

  .projects-page-content>h1 {
    margin-top: 0;
  }

  .projects-search-wrap {
    position: relative;
    display: flex;
    flex: 1;
    align-items: center;
    min-width: 0;
  }

  .projects-search-box {
    border-radius: 1.2em;
    border: none;
    padding: .2em 2.4em .2em .8em;
    flex: 1;
    width: 100%;
    box-shadow: var(--filter-btn-shadow);
    transition: box-shadow 0.3s ease;
    position: relative;
    --gradient-size: 300px;
    background: radial-gradient(circle var(--gradient-size) at var(--mouse-x) var(--mouse-y),
        var(--sidebar-border-color),
        transparent 40%);
  }

  .projects-search-clear {
    position: absolute;
    right: 0.65rem;
    top: 50%;
    transform: translateY(-50%) scale(0.65);
    background: transparent;
    border: none;
    color: var(--text-muted-color, #71717a);
    font-size: 0.85rem;
    width: 1.55rem;
    height: 1.55rem;
    padding: 0;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                color 0.15s ease,
                background-color 0.15s ease;
    z-index: 2;
  }

  .projects-search-clear:hover {
    color: var(--text-color, #ffffff);
    background: rgba(125, 125, 125, 0.15);
  }

  .projects-search-clear.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) scale(1);
  }

  .projects-search-clear.is-dissolving {
    opacity: 0 !important;
    pointer-events: none;
    transform: translateY(-50%) scale(0.65) rotate(45deg) !important;
    filter: blur(3px);
  }

  .projects-search-box:hover {
    box-shadow: var(--filter-btn-shadow);
  }

  .projects-search-box:focus {
    border-color: var(--input-focus-border-color);
    outline: none !important;
  }

  .projects-search-box:active {
    --gradient-size: 200px;
    animation: bgRadialGradientGrow 1s ease-out;
    outline: none !important;
  }

  .projects-card-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
  }

  .projects-card-container>.projects-loading {
    width: 100%;
    text-align: center;
  }

  .projects-no-results {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 3.5rem 1rem;
    color: var(--text-muted-color);
  }

  .projects-no-results i {
    font-size: 2.75rem;
    margin-bottom: 0.8rem;
    color: var(--text-muted-color);
    opacity: 0.7;
  }

  .projects-no-results p {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0;
    color: var(--text-muted-color);
  }

  /* Filters */
  .projects-filter {
    display: flex;
    flex-direction: row;
    align-items: center;
    margin-bottom: 1em;
  }

  .filter-tags {
    flex-wrap: nowrap;
    padding-left: 0.2em;
    gap: .7em;
  }

  .filter-tag {
    background-color: var(--card-bg);
    border-radius: 0.5em;
    padding: .2em .7em .2em .7em;
    border-color: var(--btn-border-color);
    box-shadow: var(--card-shadow);
    user-select: none;
    transition: all 0.2s ease-out;
  }

  .filter-icon {
    margin-right: .7em;
    user-select: none;
  }

  .filter-tag:active {
    background-color: var(--card-bg-active);
  }

  /* Tags */
  .category.project-tag {
    margin-right: 0.4em;
    margin-bottom: 0;
  }

  .project-tag-icon {
    align-content: center;
  }

  .active-tag {
    color: var(--active-tag);
  }

  /* Buttons */
  .btn-search-filter {
    background-color: var(--card-bg);
    border-radius: 0.5em;
    padding: .2em .7em .2em .7em;
    border-color: var(--btn-border-color);
    box-shadow: var(--filter-btn-shadow);
    user-select: none;
    transition: all 0.3s ease;
    outline: none;
    border: none;
  }

  .btn-search-filter:active,
  .btn-search-filter.active {
    box-shadow: var(--filter-btn-shadow-active);
    background-color: var(--card-bg-active, var(--sidebar-border-color));
    color: var(--text-color);
  }

  /* Utilities */
  .c-pointer {
    cursor: pointer;
  }

  /* Filter Elevator Reveal */
  .projects-filter-wrapper {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    width: 100%;
  }

  .projects-filter-wrapper.is-open {
    grid-template-rows: 1fr;
  }

  .projects-filter-inner {
    min-height: 0;
    overflow: hidden;
  }

  .projects-filter {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.85em;
    opacity: 0;
    transform: translateY(-22px);
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, opacity;
  }

  .projects-filter-wrapper.is-open .projects-filter {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .projects-filter-wrapper,
    .projects-filter {
      transition: none !important;
      transform: none !important;
    }
  }

  /* Error States */
  .error-loading-projects>h1 {
    margin-bottom: 0.2em;
    margin-top: 0.5em;
  }

  .error-loading-projects {
    width: 100%;
    text-align: center;
    margin-top: 2em;
    color: var(--error-color);
  }

  /* Loading indicator */
  .loader {
    color: var(--topbar-shadow);
    font-family: Consolas, Menlo, Monaco, monospace;
    font-weight: bold;
    font-size: 78px;
    opacity: 0.8;
  }

  .loader:before {
    content: "{";
    display: inline-block;
    animation: pulse 0.4s alternate infinite ease-in-out;
  }

  .loader:after {
    content: "}";
    display: inline-block;
    animation: pulse 0.4s 0.3s alternate infinite ease-in-out;
  }

  @keyframes pulse {
    to {
      transform: scale(0.9);
      opacity: 0.6;
    }
  }

  /* Media Queries */
  @media (max-width: 768px) {
    .search-box-container {
      margin-bottom: .8em;
    }

    .project-card-title a {
      border: none !important;
    }

    .filter-icon {
      display: none;
    }

    .projects-filter {
      justify-content: space-evenly;
      overflow-x: scroll;
      overflow-y: visible;
      margin-bottom: .5em;
    }

    .projects-filter::-webkit-scrollbar {
      display: none;
    }

    .filter-tags>.filter-tag:last-child {
      margin-right: 0;
    }

    .filter-tags>.filter-tag {
      flex-grow: 1;
      margin-top: 0.5em;
      text-align: center;
      flex-wrap: nowrap;
      text-wrap-mode: nowrap;
      white-space: nowrap;
    }

    .filter-tags {
      padding-bottom: .8em;
    }

    .projects-search-box {
      background: none !important;
    }
  }
</style>

<div class="projects-page-content">
  <div class="projects-top-bar">
    <h1 class="projects-top-bar-title">My Projects</h1>
    <div class="search-box-container">
      <div class="projects-search-wrap">
        <input class="projects-search-box" type="text" placeholder="Search projects..." autocomplete="off"
          id="projects-search-box" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
        <button type="button" class="projects-search-clear" id="projects-search-clear" aria-label="Clear search" title="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <button class="btn-search-filter" onclick="toggle_projects_filter()" title="Filter by"><i
          class="fa-solid fa-filter" id="clear-filter"></i></button>
    </div>
    <div class="projects-filter-wrapper" id="projects-filter-wrapper">
      <div class="projects-filter-inner">
        <div class="projects-filter w-100 d-flex align-items-center justify-content-between">
          <div class="flex-row filter-icon">
            <i class="fa-solid fa-filter"></i>
            &nbsp;&nbsp;
            <b>Filter by</b>
          </div>
          <div class="flex-row filter-tags">
            <div class="filter-tag c-pointer" onclick="filter_by_tag('')">
              <span id="current-filter-tag">All</span>
            </div>
            <div class="filter-tag c-pointer">
              <span id="current-filter-tag" onclick="filter_by_demo()">Has demo</span>
            </div>
            <div class="filter-tag c-pointer d-none" id="filter-by-tag" onclick="filter_by_tag('')">
              <span class="category project-tag">Tag</span>
              <i class="fa-solid fa-xmark" id="clear-filter"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="projects-card-container" id="projects-list">
    <!-- Content will be filled by projects loader script -->
    <div class="projects-loading mt-4 d-flex flex-column align-items-center justify-content-center">
      <!-- Loading indicator: https://cssloaders.github.io/ -->
      <span class="loader"></span>
      <small>Loading projects...</small>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/logger.js' | relative_url }}"></script>
<script src="{{ '/assets/js/projects-loader.js' | relative_url }}" defer></script>
