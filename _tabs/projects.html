---
layout: page-notitle
icon: fas fa-code
order: 4
---
<style>
  /* Layout & Structure */
  .projects-page-content {
    width: 100%;
  }

  .flex-row {
    display: flex;
    flex-direction: row;
    align-items: center;
  }

  .flex-wrap {
    flex-wrap: wrap;
  }

  .d-none {
    scale: 0;
    visibility: hidden;
  }

  /* Top Bar & Search */
  .projects-top-bar {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .projects-top-bar-title {
    margin-top: 0;
    margin-bottom: 0.5rem;
    font-family: 'Edu NSW ACT Cursive', cursive;
    font-size: calc((1.375rem + 1.5vw) + 8px);
  }

  @media (min-width: 1200px) {
    .projects-top-bar-title {
      font-size: calc(2.5rem + 8px);
    }
  }

  .search-box-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    align-items: center;
    gap: .8em;
    justify-content: flex-start;
    margin-top: .8em;
    margin-bottom: 1em;
  }

  /* Project Cards
     The wrapper is the flat pointer-tracking surface (transitions.dev card
     tilt); the card inside it is what actually rotates. */
  .project-card-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    /* Lets a finger drag tilt the card instead of scrolling the page. */
    touch-action: none;
    perspective: 1000px;
    opacity: 0;
    animation: slideIn 2s var(--spring-ease) var(--anim-delay, 0s) forwards;
  }

  .project-card {
    --tilt-rx: 0deg;
    --tilt-ry: 0deg;
    --tilt-gx: 50%;
    --tilt-gy: 50%;
    /* Proximity shadow layer, driven per-card from JS. Transparent at rest. */
    --tilt-shadow: 0 0 0 0 rgba(0, 0, 0, 0);

    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-sizing: border-box;
    /* Even padding on every side. The old card faked its vertical rhythm with
       a 2rem margin on the title and a 1.5rem margin under the tag row, so the
       top and bottom padding never matched. */
    padding: 1.25rem 1.5rem;
    background-color: var(--card-bg);
    border: 0;
    border-radius: 12px;
    text-align: left;
    overflow: hidden;
    box-shadow: var(--card-shadow), var(--tilt-shadow);
    transform:
      perspective(var(--tilt-perspective, 1000px))
      rotateX(var(--tilt-rx))
      rotateY(var(--tilt-ry));
    transform-style: preserve-3d;
    transition:
      transform 400ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 250ms ease;
    will-change: transform;
  }

  /* Short follow while the pointer moves so the tilt tracks the cursor. */
  .project-card.is-tilting {
    transition:
      transform 120ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 250ms ease;
  }

  /* No static hover shadow: the shadow is fully driven by cursor distance
     from JS (see tiltShadow), so it deepens continuously on approach. */

  /* Cursor-tracked shine: very wide, very faint wash of light that follows
     the pointer. Kept subtle on purpose - just enough to feel the surface. */
  .t-tilt-glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
    background:
      radial-gradient(circle 340px at var(--tilt-gx) var(--tilt-gy),
        rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0) 80%),
      radial-gradient(circle 560px at var(--tilt-gx) var(--tilt-gy),
        rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 75%);
    transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .project-card-wrap.is-hover .t-tilt-glare {
    opacity: 0.55;
  }

  /* Proximity shine fallback while the cursor is near but not on the card.
     JS writes a distance-ramped inline opacity on top of this. */
  .project-card-wrap.is-near .t-tilt-glare {
    opacity: 0.28;
  }

  @media (prefers-reduced-motion: reduce) {
    .project-card {
      transform: none !important;
      transition: none !important;
    }

    /* Tilt JS bails out here, so keep a plain static hover shadow. */
    .project-card-wrap:hover .project-card {
      box-shadow: var(--card-shadow), 0 14px 32px -12px rgba(0, 0, 0, 0.45);
    }

    .t-tilt-glare {
      display: none;
    }
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: scale(1.05);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Absorbs the extra height when the grid stretches cards to a common height,
     so the slack lands inside the body instead of under the tag row. That keeps
     the visible gap below the tags equal to the padding above the title. */
  .project-card-body {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    flex: 1 1 auto;
  }

  .project-card>h1,
  .project-card-title {
    margin: 0;
    font-size: 1.75rem;
    line-height: 1.2;
  }

  .project-card-tags {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
    /* The row reuses the global `.categories` class, which carries
       `margin-bottom: 2rem` for the Categories page. That was adding 32px of
       dead space under the tags and making the card's bottom padding look
       twice its top. */
    margin: 0;
  }

  .project-card-content {
    margin: 0;
    flex-grow: 1;
  }

  .project-card-bottom {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    /* flex-end, not center: when the tag row wraps to two or more lines it
       becomes much taller than the Demo button, and centering left the button
       floating in the middle of the tags. Pinning it to the end keeps it in
       the bottom-right corner at any tag count. With a single-line tag row
       both resolve to the same place. */
    align-items: flex-end;
    gap: 0.5rem;
  }

  .projects-page-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    margin-top: 0;
  }

  .projects-page-content>h1 {
    margin-top: 0;
  }

  .projects-search-wrap {
    position: relative;
    display: flex;
    flex: 1;
    align-items: center;
    min-width: 0;
  }

  .projects-search-box {
    border-radius: 1.2em;
    border: none;
    padding: .2em 2.4em .2em .8em;
    flex: 1;
    width: 100%;
    box-shadow: var(--filter-btn-shadow);
    transition: box-shadow 0.3s ease;
    position: relative;
    --gradient-size: 300px;
    background: radial-gradient(circle var(--gradient-size) at var(--mouse-x) var(--mouse-y),
        var(--sidebar-border-color),
        transparent 40%);
  }

  .projects-search-clear {
    position: absolute;
    right: 0.65rem;
    top: 50%;
    transform: translateY(-50%) scale(0.65);
    background: transparent;
    border: none;
    color: var(--text-muted-color, #71717a);
    font-size: 0.85rem;
    width: 1.55rem;
    height: 1.55rem;
    padding: 0;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                color 0.15s ease,
                background-color 0.15s ease;
    z-index: 2;
  }

  .projects-search-clear:hover {
    color: var(--text-color, #ffffff);
    background: rgba(125, 125, 125, 0.15);
  }

  .projects-search-clear.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) scale(1);
  }

  .projects-search-clear.is-dissolving {
    opacity: 0 !important;
    pointer-events: none;
    transform: translateY(-50%) scale(0.65) rotate(45deg) !important;
    filter: blur(3px);
  }

  .projects-search-box:hover {
    box-shadow: var(--filter-btn-shadow);
  }

  .projects-search-box:focus {
    border-color: var(--input-focus-border-color);
    outline: none !important;
  }

  .projects-search-box:active {
    --gradient-size: 200px;
    animation: bgRadialGradientGrow 1s ease-out;
    outline: none !important;
  }

  .projects-card-container {
    width: 100%;
  }

  /* Grid view (default)
     The content column is only ~620px wide (the layout caps main at col-xl-9),
     so a 320px track floor collapsed the grid to a single column - which made
     the grid/list toggle look like it did nothing. 270px guarantees at least two
     columns here, and the min() wrapper stops the track overflowing on phones. */
  .projects-card-container:not(.list-view),
  .projects-card-container.grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
    gap: 1.25rem;
    align-items: stretch;
  }

  /* The wrapper is the grid/flex child now, so the card sizing rules move to it. */
  .projects-card-container:not(.list-view) .project-card-wrap,
  .projects-card-container.grid-view .project-card-wrap {
    margin-bottom: 0;
    height: 100%;
  }

  /* List view */
  .projects-card-container.list-view {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    align-items: center;
    text-align: center;
  }

  .projects-card-container.list-view .project-card-wrap {
    margin-bottom: 0;
    width: 100%;
  }

  .projects-card-container > .projects-loading,
  .projects-card-container > .projects-no-results {
    grid-column: 1 / -1;
    width: 100%;
    text-align: center;
  }

  .projects-no-results {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 3.5rem 1rem;
    color: var(--text-muted-color);
  }

  .projects-no-results i {
    font-size: 2.75rem;
    margin-bottom: 0.8rem;
    color: var(--text-muted-color);
    opacity: 0.7;
  }

  .projects-no-results p {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0;
    color: var(--text-muted-color);
  }

  /* Filters */
  .projects-filter {
    display: flex;
    flex-direction: row;
    align-items: center;
    margin-bottom: 1em;
  }

  .filter-tags {
    flex-wrap: nowrap;
    padding-left: 0.2em;
    gap: .7em;
  }

  .filter-tag {
    background-color: var(--card-bg);
    border-radius: 0.5em;
    padding: .2em .7em .2em .7em;
    border-color: var(--btn-border-color);
    box-shadow: var(--card-shadow);
    user-select: none;
    transition: all 0.2s ease-out;
  }

  .filter-icon {
    margin-right: .7em;
    user-select: none;
  }

  .filter-tag:active {
    background-color: var(--card-bg-active);
  }

  /* All / Has demo segmented toggle. Reuses the shared .t-tabs sliding pill
     (_sass/components/_view-toggle.scss); the modifier lets the tabs size to
     their labels instead of the 38px icon square. */
  .filter-toggle {
    gap: 2px;
    touch-action: none;
    user-select: none;
  }

  .t-tabs--auto .t-tab {
    width: auto;
    min-width: 0;
    padding: 0 0.9em;
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
  }

  .filter-toggle .t-tabs-pill {
    opacity: 1;
    transition:
      transform var(--tabs-dur) var(--tabs-ease),
      width var(--tabs-dur) var(--tabs-ease),
      opacity 180ms ease;
  }

  .filter-toggle .t-tab:focus-visible {
    outline: 3px solid var(--link-color);
    outline-offset: 2px;
  }

  /* Tags */
  .category.project-tag {
    margin-right: 0.4em;
    margin-bottom: 0;
  }

  .project-tag-icon {
    align-content: center;
  }

  .active-tag {
    color: var(--active-tag);
  }

  /* Buttons */
  .btn-search-filter {
    background-color: var(--card-bg);
    border-radius: 0.5em;
    padding: .2em .7em .2em .7em;
    border-color: var(--btn-border-color);
    box-shadow: var(--filter-btn-shadow);
    user-select: none;
    transition: all 0.3s ease;
    outline: none;
    border: none;
  }

  .btn-search-filter:active,
  .btn-search-filter.active {
    box-shadow: var(--filter-btn-shadow-active);
    background-color: var(--card-bg-active, var(--sidebar-border-color));
    color: var(--text-color);
  }

  /* Utilities */
  .c-pointer {
    cursor: pointer;
  }

  /* Filter Elevator Reveal */
  .projects-filter-wrapper {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    width: 100%;
  }

  .projects-filter-wrapper.is-open {
    grid-template-rows: 1fr;
  }

  .projects-filter-inner {
    min-height: 0;
    overflow: hidden;
    padding: 0.25rem 0.5rem 0;
  }

  .projects-filter {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 0.35rem 0.4rem 0.85em;
    opacity: 0;
    transform: translateY(-22px);
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, opacity;
  }

  .projects-filter-wrapper.is-open .projects-filter {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .projects-filter-wrapper,
    .projects-filter {
      transition: none !important;
      transform: none !important;
    }
  }

  /* Error States */
  .error-loading-projects>h1 {
    margin-bottom: 0.2em;
    margin-top: 0.5em;
  }

  .error-loading-projects {
    width: 100%;
    text-align: center;
    margin-top: 2em;
    color: var(--error-color);
  }

  /* Loading indicator */
  .loader {
    color: var(--topbar-shadow);
    font-family: Consolas, Menlo, Monaco, monospace;
    font-weight: bold;
    font-size: 78px;
    opacity: 0.8;
  }

  .loader:before {
    content: "{";
    display: inline-block;
    animation: pulse 0.4s alternate infinite ease-in-out;
  }

  .loader:after {
    content: "}";
    display: inline-block;
    animation: pulse 0.4s 0.3s alternate infinite ease-in-out;
  }

  @keyframes pulse {
    to {
      transform: scale(0.9);
      opacity: 0.6;
    }
  }

  /* Media Queries */
  @media (max-width: 768px) {
    .search-box-container {
      margin-bottom: .8em;
    }

    .project-card-title a {
      border: none !important;
    }

    .filter-icon {
      display: none;
    }

    .projects-filter {
      justify-content: space-evenly;
      overflow-x: scroll;
      overflow-y: visible;
      margin-bottom: -0.5em;
      padding: 0.35rem 0.4rem 0.85em;
    }

    .projects-filter::-webkit-scrollbar {
      display: none;
    }

    .filter-tags>.filter-tag:last-child {
      margin-right: 0;
    }

    .filter-tags>.filter-tag {
      flex-grow: 1;
      margin-top: 0.5em;
      text-align: center;
      flex-wrap: nowrap;
      text-wrap-mode: nowrap;
      white-space: nowrap;
    }

    .filter-tags {
      padding-bottom: .8em;
    }

    .projects-search-box {
      background: none !important;
    }

    .layout-toggle {
      display: none;
    }

    .filter-tags {
      flex-wrap: wrap;
      width: 100%;
    }

    .filter-toggle {
      flex: 1 1 100%;
      width: 100%;
    }

    .filter-toggle .t-tab {
      flex: 1 1 0;
      justify-content: center;
    }
  }
</style>

<div class="projects-page-content">
  <div class="projects-top-bar">
    <h1 class="projects-top-bar-title">My Projects</h1>
    <div class="search-box-container">
      <div class="projects-search-wrap">
        <input class="projects-search-box" type="text" placeholder="Search projects..." autocomplete="off"
          id="projects-search-box" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
        <button type="button" class="projects-search-clear" id="projects-search-clear" aria-label="Clear search" title="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <button class="btn-search-filter" onclick="toggle_projects_filter()" title="Filter by"><i
          class="fa-solid fa-filter" id="clear-filter"></i></button>
      <div class="t-tabs view-toggle layout-toggle" role="group" aria-label="Change projects layout">
        <span class="t-tabs-pill" aria-hidden="true" style="transform: translateX(3px); width: 38px;"></span>
        <button class="t-tab" type="button" data-view="grid" aria-pressed="true" aria-label="Grid view" title="Grid view">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"></rect><rect x="9" y="1" width="6" height="6" rx="1.5"></rect><rect x="1" y="9" width="6" height="6" rx="1.5"></rect><rect x="9" y="9" width="6" height="6" rx="1.5"></rect></svg>
        </button>
        <button class="t-tab" type="button" data-view="list" aria-pressed="false" aria-label="List view" title="List view">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 4h9M6 8h9M6 12h9"></path><circle cx="2.4" cy="4" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="2.4" cy="8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="2.4" cy="12" r="1.1" fill="currentColor" stroke="none"></circle></svg>
        </button>
      </div>
    </div>
    <div class="projects-filter-wrapper" id="projects-filter-wrapper">
      <div class="projects-filter-inner">
        <div class="projects-filter w-100 d-flex align-items-center justify-content-between">
          <div class="flex-row filter-icon">
            <i class="fa-solid fa-filter"></i>
            &nbsp;&nbsp;
            <b>Filter by</b>
          </div>
          <div class="flex-row filter-tags">
            <div class="t-tabs view-toggle filter-toggle t-tabs--auto" role="group" aria-label="Filter projects">
              <span class="t-tabs-pill" aria-hidden="true" style="transform: translateX(3px); width: 0;"></span>
              <button class="t-tab" type="button" data-filter="all" aria-pressed="true">All</button>
              <button class="t-tab" type="button" data-filter="demo" aria-pressed="false">Has demo</button>
            </div>
            <div class="filter-tag c-pointer d-none" id="filter-by-tag" onclick="filter_by_tag('')">
              <span class="category project-tag">Tag</span>
              <i class="fa-solid fa-xmark" id="clear-filter-tag"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="projects-card-container" id="projects-list">
    <!-- Content will be filled by projects loader script -->
    <div class="projects-loading mt-4 d-flex flex-column align-items-center justify-content-center">
      <!-- Loading indicator: https://cssloaders.github.io/ -->
      <span class="loader"></span>
      <small>Loading projects...</small>
    </div>
  </div>
</div>

<!-- ?v=site.time busts the browser's disk cache on every build, so iterating
     on this WIP feature can't leave the page running stale JS again. -->
<script src="{{ '/assets/js/logger.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/rubber-segment.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/projects-loader.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
