  <!-- Minimal elements required for app.js to attach event listeners without crashing -->
  <div class="toast-body" style="display: none;">
    <button type="button" class="btn btn-primary" aria-label="Update"></button>
  </div>
</aside>

<!-- Instantly apply page updates by hijacking the notification dialog -->
<script>
  (function() {
    const notification = document.getElementById('notification');
    if (notification) {
      const observer = new MutationObserver((mutations) => {
        if (notification.classList.contains('show')) {
          const btn = notification.querySelector('.toast-body > button');
          if (btn) btn.click();
        }
      });
      observer.observe(notification, { attributes: true, attributeFilter: ['class'] });
    }
  })();
</script>
