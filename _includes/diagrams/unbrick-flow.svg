<svg class="dg" viewBox="0 0 700 306" width="700" height="306" role="img" aria-label="Five-step unbrick chain: force fastboot, verify unlock state, flash gpt_both0.bin, flash vbmeta.img, run flash_all.bat">
<text class="dg-title" x="0" y="26" text-anchor="start">The unbrick chain, in order</text><circle class="dg-ring" cx="18" cy="74" r="13"/><text class="dg-num" x="18" y="78.5" text-anchor="middle">1</text><text class="dg-body" x="48" y="78" text-anchor="start">Vol ↓ + Power, hold 10–15 s</text><text class="dg-small" x="48" y="99" text-anchor="start">keeps the screen dark until the fastboot logo appears</text><circle class="dg-ring" cx="18" cy="122" r="13"/><text class="dg-num" x="18" y="126.5" text-anchor="middle">2</text><text class="dg-body dg-mono" x="48" y="126" text-anchor="start">fastboot oem device-info</text><text class="dg-small" x="48" y="147" text-anchor="start">both unlock flags at the bottom must read true</text><circle class="dg-ring" cx="18" cy="170" r="13"/><text class="dg-num" x="18" y="174.5" text-anchor="middle">3</text><text class="dg-body dg-mono" x="48" y="174" text-anchor="start">fastboot flash partition gpt_both0.bin</text><text class="dg-small" x="48" y="195" text-anchor="start">the factory partition table goes back first</text><circle class="dg-ring" cx="18" cy="218" r="13"/><text class="dg-num" x="18" y="222.5" text-anchor="middle">4</text><text class="dg-body dg-mono" x="48" y="222" text-anchor="start">fastboot flash vbmeta vbmeta.img</text><text class="dg-small" x="48" y="243" text-anchor="start">plain, no --disable-verity on stock ginkgo</text><circle class="dg-ring" cx="18" cy="266" r="13"/><text class="dg-num" x="18" y="270.5" text-anchor="middle">5</text><text class="dg-body dg-mono" x="48" y="270" text-anchor="start">flash_all.bat</text><text class="dg-small" x="48" y="291" text-anchor="start">flashes every image, then reboots the phone</text>
</svg>
