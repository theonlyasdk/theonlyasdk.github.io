<svg class="dg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Two columns showing that booting MIUI between flashing and opening recovery restores the stock recovery">
<text class="dg-title" x="0" y="26" text-anchor="start">The recovery trap after flashing</text><text class="dg-body-strong dg-accent" x="0" y="68" text-anchor="start">Do this</text><text class="dg-body-strong" x="370" y="68" text-anchor="start">Not this</text><text class="dg-mono dg-small-strong" x="0" y="114" text-anchor="start">fastboot flash recovery recovery.img</text><line class="dg-rule" x1="0" y1="130" x2="330" y2="130"/><text class="dg-mono dg-small-strong" x="0" y="160" text-anchor="start">fastboot reboot recovery</text><line class="dg-rule" x1="0" y1="176" x2="330" y2="176"/><text class="dg-mono dg-small-strong" x="0" y="206" text-anchor="start">OrangeFox opens, flash the ROM</text><line class="dg-rule" x1="0" y1="222" x2="330" y2="222"/><text class="dg-mono dg-small-strong" x="370" y="114" text-anchor="start">fastboot flash recovery recovery.img</text><line class="dg-rule" x1="370" y1="130" x2="700" y2="130"/><text class="dg-mono dg-small-strong" x="370" y="160" text-anchor="start">reboot into MIUI as usual</text><line class="dg-rule" x1="370" y1="176" x2="700" y2="176"/><text class="dg-mono dg-small-strong" x="370" y="206" text-anchor="start">MIUI restores the stock recovery</text><line class="dg-rule" x1="370" y1="222" x2="700" y2="222"/><text class="dg-small" x="0" y="248" text-anchor="start">The stock recovery is replaced, and it stays replaced.</text><text class="dg-small" x="370" y="248" text-anchor="start">Your recovery is gone, the ROM zip is on the phone.</text><line class="dg-rule" x1="0" y1="272" x2="700" y2="272"/><text class="dg-small" x="0" y="302" text-anchor="start">Same two commands in both columns. Only the boot in between differs.</text>
</svg>
