<svg class="dg" viewBox="0 0 700 386" width="700" height="386" role="img" aria-label="Table matching four ginkgo builds to what you need from the phone">
<text class="dg-title" x="0" y="26" text-anchor="start">Which ginkgo build should you run?</text><line class="dg-rule" x1="0" y1="48" x2="700" y2="48"/><text class="dg-th" x="12" y="68" text-anchor="start">You want</text><text class="dg-th" x="212" y="68" text-anchor="start">Build</text><text class="dg-th" x="412" y="68" text-anchor="start">What you give up</text><line class="dg-rule" x1="0" y1="78" x2="700" y2="78"/><line class="dg-rule" x1="0" y1="142" x2="700" y2="142"/><text class="dg-body" x="12" y="116.0" text-anchor="start">Maximum FPS in games</text><text class="dg-body-strong" x="212" y="106.0" text-anchor="start">LineageOS 18.1</text><text class="dg-small" x="212" y="130.0" text-anchor="start">Android 11</text><text class="dg-small" x="412" y="106.0" text-anchor="start">Lightest build, fastest UI</text><text class="dg-small" x="412" y="130.0" text-anchor="start">on this chipset.</text><line class="dg-rule" x1="0" y1="206" x2="700" y2="206"/><text class="dg-body" x="12" y="180.0" text-anchor="start">A daily driver, patched</text><text class="dg-body-strong" x="212" y="170.0" text-anchor="start">LineageOS 22.2</text><text class="dg-small" x="212" y="194.0" text-anchor="start">Android 15</text><text class="dg-small" x="412" y="170.0" text-anchor="start">Clean and maintained. No</text><text class="dg-small" x="412" y="194.0" text-anchor="start">Google apps unless you add them.</text><line class="dg-rule" x1="0" y1="270" x2="700" y2="270"/><text class="dg-body" x="12" y="234.0" text-anchor="start">Banking apps that</text><text class="dg-body" x="12" y="258.0" text-anchor="start">pass Play Integrity</text><text class="dg-body-strong" x="212" y="234.0" text-anchor="start">Project Infinity X</text><text class="dg-small" x="212" y="258.0" text-anchor="start">Android 15</text><text class="dg-small" x="412" y="234.0" text-anchor="start">GApps and the integrity</text><text class="dg-small" x="412" y="258.0" text-anchor="start">fixes are already in it.</text><line class="dg-rule" x1="0" y1="334" x2="700" y2="334"/><text class="dg-body" x="12" y="298.0" text-anchor="start">The HyperOS /</text><text class="dg-body" x="12" y="322.0" text-anchor="start">ColorOS look</text><text class="dg-body-strong" x="212" y="298.0" text-anchor="start">OEM ports</text><text class="dg-small" x="212" y="322.0" text-anchor="start">needs a repartition</text><text class="dg-small" x="412" y="298.0" text-anchor="start">Heaviest option, and it</text><text class="dg-small" x="412" y="322.0" text-anchor="start">rewrites your partition table.</text><line class="dg-rule" x1="0" y1="48" x2="0" y2="334"/><line class="dg-rule" x1="200" y1="48" x2="200" y2="334"/><line class="dg-rule" x1="400" y1="48" x2="400" y2="334"/><line class="dg-rule" x1="699" y1="48" x2="699" y2="334"/><text class="dg-small" x="0" y="364" text-anchor="start">All four still need MIUI 12.5 / Android 11 underneath.</text>
</svg>
