# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Queued duplicates are canceled: for this site the latest pushed commit is
# the desired production state, so mid-deploy runs keep superseding, and
# burst pushes skip straight to the newest one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3' # Matches Gemfile.lock and local dev bundles
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Bumped to re-key the gem cache for Ruby 3.3
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate source references
        run: ruby tools/validate_site.rb
      - name: Check JavaScript syntax
        shell: bash
        run: find assets/js goodies -type f -name '*.js' -print0 | xargs -0 -n1 -P$(nproc) node --check
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Validate inline scripts in generated HTML
        run: node tools/check_inline_scripts.js
      - name: Check generated HTML and internal links
        run: bundle exec htmlproofer ./_site --disable-external --checks Links,Images,Scripts --allow-hash-href
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
