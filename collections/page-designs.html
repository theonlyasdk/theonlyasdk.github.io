---
layout: page-notitle
title: Printable Page Templates
permalink: /collections/page-designs/
---

<style>
  .pdesign-card {
    background-color: var(--card-bg);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    text-align: left;
    padding: 0 0 1.5rem 0;
    width: 100%;
    height: 100%;
    margin-bottom: 0;
    box-shadow: var(--card-shadow);
    border: 0;
    opacity: 0;
    overflow: hidden;
    animation: pdesignIn 1.5s var(--spring-ease, ease-out) var(--anim-delay, 0s) forwards;
    cursor: pointer;
    transition: transform 0.3s var(--spring-ease, ease-out), box-shadow 0.3s ease;
  }

  .pdesign-card h5 {
    padding: 0 2rem;
    margin-top: 1.5rem;
    margin-bottom: 0.4rem;
    font-weight: light;
    font-size: 1.6rem;
  }

  .pdesign-card p {
    padding: 0 2rem;
    margin-bottom: 0;
    line-height: 1.4;
    flex-grow: 1;
  }

  .pdesign-card:active {
    filter: brightness(90%);
  }

  .pdesign-card:focus-visible,
  .pdesign-filter button:focus-visible,
  .pdesign-search-clear:focus-visible {
    outline: 3px solid var(--link-color);
    outline-offset: 3px;
  }

  .pdesign-cover {
    position: relative;
    /* Every sheet is A4 portrait, so match that ratio exactly: the preview then
       fills the card edge to edge instead of leaving side bands. */
    aspect-ratio: 210 / 297;
    height: auto;
    overflow: hidden;
    margin: 0;
    flex-shrink: 0;
    background: var(--main-bg);
  }

  .pdesign-cover img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .pdesign-image-fallback {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    color: var(--text-muted-color);
    background: var(--main-bg);
  }

  .pdesign-search {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background-color: var(--card-bg);
    border: 1px solid var(--sidebar-border-color);
    border-radius: 0.75rem;
    padding: 0.55rem 0.9rem;
    margin-top: 1rem;
    box-shadow: var(--card-shadow);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .pdesign-search:focus-within {
    border-color: var(--link-color);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--link-color) 25%, transparent);
  }

  .pdesign-search svg {
    flex-shrink: 0;
    width: 1rem;
    height: 1rem;
    color: var(--text-muted-color);
  }

  .pdesign-search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: none;
    color: var(--text-color);
    font-size: 0.95rem;
  }

  .pdesign-search input::placeholder {
    color: var(--text-muted-color);
  }

  .pdesign-search input[type="search"]::-webkit-search-cancel-button {
    display: none;
  }

  .pdesign-search-clear {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.4rem;
    height: 1.4rem;
    border-radius: 999px;
    border: 0;
    background: var(--btn-border-color);
    color: var(--text-muted-color);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0 0.1rem;
  }

  .pdesign-search-clear:hover {
    color: var(--text-color);
  }

  .pdesign-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.9rem;
  }

  .pdesign-filter-btn {
    background-color: var(--card-bg);
    border-radius: 0.5em;
    padding: 0.2em 0.7em;
    border-color: var(--btn-border-color);
    box-shadow: var(--filter-btn-shadow);
    color: var(--text-color);
    user-select: none;
    transition: all 0.3s ease;
    outline: none;
    border: none;
  }

  .pdesign-filter-btn:hover,
  .pdesign-filter-btn:active,
  .pdesign-filter-btn.active {
    background: var(--card-bg-active);
    box-shadow: var(--filter-btn-shadow-active);
  }

  #pdesigns-grid {
    margin-top: 0.5rem;
  }

  .pdesign-empty-col {
    flex: 0 0 100%;
    max-width: 100%;
  }

  .pdesign-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 38vh;
    padding: 2.5rem 1rem;
    color: var(--text-muted-color);
  }

  .pdesign-empty svg {
    width: 2.5rem;
    height: 2.5rem;
    margin-bottom: 0.75rem;
    opacity: 0.6;
    transform-origin: center;
    animation: pdesign-empty-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .pdesign-empty p {
    margin-bottom: 0.25rem;
    max-width: 26rem;
  }

  @keyframes pdesign-empty-pop {
    0% { transform: scale(0.3); }
    55% { transform: scale(1.2); }
    75% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  @keyframes pdesignIn {
    from {
      opacity: 0;
      transform: scale(1.05);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Preview modal */
  .pdesign-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    display: none;
    opacity: 0;
    transition: opacity 0.25s ease-out;
    justify-content: center;
    align-items: center;
  }

  .pdesign-modal-overlay.active {
    display: flex;
    opacity: 1;
  }

  .pdesign-modal-overlay.closing {
    opacity: 0;
    pointer-events: none;
  }

  @keyframes pdesignZoomIn {
    from {
      opacity: 0;
      transform: scale(0.85);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes pdesignFadeOut {
    from {
      opacity: 1;
      transform: scale(1);
    }
    to {
      opacity: 0;
      transform: scale(0.92);
    }
  }

  .pdesign-modal-content {
    background: var(--main-bg);
    width: 95%;
    height: 95%;
    max-width: 1000px;
    border-radius: 20px;
    position: relative;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: pdesignZoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .pdesign-modal-overlay.closing .pdesign-modal-content {
    animation: pdesignFadeOut 0.25s ease-out both;
  }

  @media (max-width: 768px) {
    .pdesign-modal-content {
      width: 100%;
      height: 100%;
      border-radius: 0;
      max-width: none;
    }
  }

  .pdesign-modal-header {
    padding: 0.5rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--sidebar-border-color);
    gap: 0.75rem;
  }

  .pdesign-modal-title {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    min-width: 0;
  }

  .pdesign-title-icon {
    width: 1.35rem;
    height: 1.35rem;
    flex-shrink: 0;
    color: var(--text-muted-color);
  }

  .pdesign-modal-actions {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    flex-shrink: 0;
  }

  .pdesign-modal-link {
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    text-decoration: none;
  }

  .pdesign-modal-link:hover {
    text-decoration: underline;
  }

  .pdesign-modal-link svg {
    width: 0.95rem;
    height: 0.95rem;
    flex-shrink: 0;
  }

  .pdesign-modal-close {
    background: none;
    border: none;
    font-size: 2rem;
    color: var(--text-color);
    cursor: pointer;
    line-height: 1;
    transition: opacity 0.2s;
  }

  .pdesign-modal-close:hover {
    opacity: 0.6;
  }

  .pdesign-modal-body {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: var(--main-bg);
  }

  .pdesign-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Folder Cards & Stacked Preview */
  .pdesign-card.is-folder {
    border: 1px solid var(--sidebar-border-color);
  }

  .pdesign-card.is-folder:hover {
    border-color: color-mix(in srgb, var(--link-color) 40%, var(--sidebar-border-color));
  }

  .pdesign-folder-cover {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--main-bg);
    position: relative;
    overflow: hidden;
  }

  .pdesign-stack {
    position: relative;
    width: 74%;
    aspect-ratio: 210 / 297;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pdesign-stack-sheet {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.35),
      0 8px 20px -2px rgba(0, 0, 0, 0.45),
      0 3px 8px -1px rgba(0, 0, 0, 0.35);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
  }

  .pdesign-stack-sheet img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #ffffff;
    border-radius: 0;
  }

  /* Back sheet: tilted counter-clockwise, top edge peeks out at top right, left edge peeks out left */
  .pdesign-stack-sheet-3 {
    transform: rotate(-7deg) translate(-2px, -8px);
    opacity: 0.9;
    z-index: 0;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.25),
      0 6px 16px rgba(0, 0, 0, 0.4);
  }

  /* Middle sheet: tilted clockwise, right edge and top left peek out */
  .pdesign-stack-sheet-2 {
    transform: rotate(7deg) translate(8px, -2px);
    opacity: 0.96;
    z-index: 1;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.3),
      0 8px 20px rgba(0, 0, 0, 0.45);
  }

  /* Front sheet: upright, prominent elevation */
  .pdesign-stack-sheet-1 {
    transform: rotate(0deg);
    z-index: 2;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.55),
      0 12px 28px -4px rgba(0, 0, 0, 0.55),
      0 4px 10px rgba(0, 0, 0, 0.3);
  }

  .pdesign-card.is-folder:hover .pdesign-stack-sheet-3 {
    transform: rotate(-10deg) translate(-6px, -12px);
  }

  .pdesign-card.is-folder:hover .pdesign-stack-sheet-2 {
    transform: rotate(10deg) translate(14px, -3px);
  }

  .pdesign-card.is-folder:hover .pdesign-stack-sheet-1 {
    transform: translateY(-5px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.7),
      0 16px 36px -4px rgba(0, 0, 0, 0.65),
      0 6px 14px rgba(0, 0, 0, 0.35);
  }

  .pdesign-folder-pill {
    position: absolute;
    bottom: 0.75rem;
    right: 0.75rem;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    background-color: var(--card-bg);
    border: 1px solid var(--sidebar-border-color);
    color: var(--text-color);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .pdesign-folder-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pdesign-folder-arrow {
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    color: var(--text-muted-color);
    flex-shrink: 0;
    margin-left: 0.5rem;
  }

  .pdesign-card.is-folder:hover .pdesign-folder-arrow {
    transform: translateX(4px);
    color: var(--link-color);
  }

  /* Folder Top Navigation / Header */
  .pdesign-folder-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .pdesign-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.65rem 0.95rem;
    border-radius: 0.85rem;
    border: 1px solid var(--sidebar-border-color);
    background: var(--card-bg);
    color: var(--text-color);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pdesign-back-btn:hover {
    background-color: var(--card-bg-active, var(--sidebar-border-color));
    color: var(--link-color);
    border-color: color-mix(in srgb, var(--link-color) 40%, var(--sidebar-border-color));
  }

  .pdesign-back-btn:active {
    background-color: color-mix(in srgb, var(--link-color) 12%, var(--card-bg));
    border-color: var(--link-color);
  }

  .pdesign-back-btn svg {
    width: 14px;
    height: 14px;
  }

  .pdesign-folder-card {
    flex-grow: 1;
    min-width: 0;
    padding: 0.65rem 1.1rem;
    background-color: var(--card-bg);
    border: 1px solid var(--sidebar-border-color);
    border-radius: 0.85rem;
    box-shadow: var(--card-shadow);
  }

  .pdesign-folder-info {
    flex-grow: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .pdesign-folder-title-row {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
    line-height: 1.25;
  }

  .pdesign-folder-heading {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.25;
    color: var(--heading-color);
    margin: 0;
  }

  .pdesign-folder-count-badge {
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background-color: var(--card-bg-active, var(--sidebar-border-color)) !important;
    color: var(--text-muted-color) !important;
    border: 1px solid var(--sidebar-border-color);
    line-height: 1.3;
  }

  .pdesign-folder-desc {
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .pdesign-card,
    .pdesign-modal-content,
    .pdesign-modal-overlay {
      animation: none;
      transition: none;
    }

    .pdesign-card {
      opacity: 1;
    }

    .pdesign-empty svg {
      animation: none;
    }

    .pdesign-stack,
    .pdesign-stack-sheet,
    .pdesign-folder-arrow,
    .pdesign-back-btn,
    .pdesign-back-btn svg {
      animation: none !important;
      transition: none !important;
      transform: none !important;
    }
  }
</style>

<h1 class="mt-5 mb-2" id="pdesign-main-title">Printable Page Templates</h1>
  <p class="text-muted" id="pdesign-page-lead">A4 sheets ready to print for homework, notes, and projects. Click any page to preview it, then download the PDF.</p>

<div class="pdesign-folder-header" id="pdesign-folder-header" style="display: none;">
  <button type="button" class="pdesign-back-btn" id="pdesign-back-btn" aria-label="Back to all templates">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 12L6 8L10 4"/>
    </svg>
    <span>All Templates</span>
  </button>
  <div class="pdesign-folder-card">
    <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
      <p class="pdesign-folder-desc text-muted mb-0" id="pdesign-folder-desc"></p>
      <span class="badge pdesign-folder-count-badge ms-auto" id="pdesign-folder-count-badge">0 templates</span>
    </div>
  </div>
</div>

<div class="pdesign-search" role="search">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
  <input type="search" id="pdesign-search" placeholder="Search templates by name..." aria-label="Search page templates" autocomplete="off">
  <button type="button" class="pdesign-search-clear" id="pdesign-search-clear" aria-label="Clear search" hidden>&times;</button>
</div>
<div class="pdesign-filter" id="pdesign-filter" aria-label="Filter page templates"></div>
<div class="row row-cols-1 row-cols-md-2 g-4" id="pdesigns-grid" aria-live="polite"></div>

<!-- Preview modal -->
<div id="pdesign-modal" class="pdesign-modal-overlay" onclick="closeDesignPreview(event)">
  <div class="pdesign-modal-content">
    <div class="pdesign-modal-header">
      <h3 id="pdesign-modal-title" class="pdesign-modal-title">
        <span id="pdesign-modal-title-text">Preview</span>
      </h3>
      <div class="pdesign-modal-actions">
        <a id="pdesign-modal-download" class="pdesign-modal-link small" href="#" download>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/><path d="M8 2.5v7m-3-3 3 3 3-3"/></svg>
          <span>Download PDF</span>
        </a>
        <a id="pdesign-modal-open" class="pdesign-modal-link small" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3"/><path d="M9.5 2.5h4v4m-8.5 7L13.5 2.5"/></svg>
          <span>Open in a new tab</span>
        </a>
        <button class="pdesign-modal-close" aria-label="Close preview" onclick="closeDesignPreview(event, true)">&times;</button>
      </div>
    </div>
    <div class="pdesign-modal-body" id="pdesign-modal-body"></div>
  </div>
</div>

<script type="application/json" id="pdesigns-data">{{ site.data.page_designs | jsonify }}</script>
<script type="application/json" id="pfolders-data">{{ site.data.page_folders | jsonify }}</script>
<script src="{{ '/assets/js/collection-grid.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/page-designs.js' | relative_url }}" defer></script>
