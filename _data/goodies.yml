# Each goodie renders one or two corner buttons on its card:
#   Info    - always present; opens the `info` block below in a dialog
#   Credits - only present when a `credits` block exists (third-party work)
# `info.summary` falls back to `description` when omitted, and `controls`
# and `tech` are optional blocks. Goodies with no `credits` block are the
# ones built for this site, so their Info dialog also carries the author line.

- name: Fluid simulation
  category: Simulations
  description: A real-time WebGL fluid dynamics simulation with smoke and particles.
  image: /assets/img/goodies/fluid_simulation.png
  iframe_url: https://paveldogreat.github.io/WebGL-Fluid-Simulation/
  credits:
    title: WebGL Fluid Simulation
    author: Pavel Dobryakov
    github_user: PavelDoGreat
    repo_url: https://github.com/PavelDoGreat/WebGL-Fluid-Simulation
    license: MIT License
    license_url: https://github.com/PavelDoGreat/WebGL-Fluid-Simulation/blob/master/LICENSE
    description: Original WebGL Fluid Simulation created by Pavel Dobryakov. Licensed under the MIT License.

- name: Cellular automaton
  category: Experiments
  description: A grid-based cellular automaton with editable rules and starting patterns.
  image: /assets/img/goodies/cellular_automaton.png
  iframe_url: /goodies/cellular-automaton/index.html
  info:
    summary: A grid of cells that lives by a single rule. Every generation each cell counts its neighbours and decides whether to live, die or be born, and out of that one local rule come gliders, oscillators and structures that keep churning long after you stop drawing.
    controls: Drag on the grid to seed cells, then step or play the simulation. The sidebar arrows cycle the rule set and the starting pattern, and the telemetry HUD reports generation, population and births/deaths.
    tech:
      - Canvas 2D
      - Vanilla JS

- name: Procedural terrain
  category: Demos
  description: Procedurally generated terrain with biomes, ridgelines, and horizon fog.
  image: /assets/img/goodies/procedural_terrain.png
  iframe_url: /goodies/procedural-terrain/index.html
  info:
    summary: A landscape built from noise rather than authored by hand. Biomes, ridgelines and horizon fog are all derived from the height field as you move, so there is no edge to reach and no two flights the same.
    controls: Fly with the mouse and WASD in Free cam, or switch to Explore for a guided pass. The sidebar carries the quality presets, the frame-rate target and the post-processing switches such as SSAO and underwater fog.
    tech:
      - Three.js
      - WebGL
      - GLSL post-processing

- name: Sorting visualizer
  category: Tools
  description: Visualizes sorting algorithms step by step, showing comparisons and swaps.
  image: /assets/img/goodies/sorting_visualizer.png
  iframe_url: /goodies/sorting-visualizer/index.html
  info:
    summary: Sorting algorithms turned into a performance. Every comparison, swap and write is drawn as it happens, so the shape of an algorithm is legible long before the array comes back ordered.
    controls: The sidebar arrows step through algorithms, starting patterns, projections and sound packs. Pick a palette from the swatches, then play, pause or restart the run.
    tech:
      - Canvas 2D
      - Web Audio

- name: Fractal viewer
  category: Experiments
  description: Renders Mandelbrot and Julia sets per pixel on the GPU, with zoom and pan.
  image: /assets/img/goodies/fractal_viewer.png
  iframe_url: /goodies/fractal-viewer/index.html
  info:
    summary: The Mandelbrot and Julia sets evaluated per pixel on the GPU, so every band of detail that appears as you zoom is computed on the spot rather than stored. Nothing is pre-rendered and the only ceiling is floating-point precision.
    controls: Drag to pan and scroll to zoom. The sidebar holds the palette presets and a W/H plus Apply pair for rendering at a custom size.
    tech:
      - WebGL2
      - GLSL fragment shaders

- name: Terminal emulator
  category: Tools
  description: A retro-styled terminal emulator that runs entirely in the browser.
  image: /assets/img/goodies/terminal_emulator.png
  iframe_url: https://theonlyasdk.github.io/blockterm/
  info:
    summary: A retro-styled terminal emulator that runs entirely in the browser. It brings a command-line interface to the web, complete with a classic look and feel, and can be used directly inside the viewer or opened in a new tab for a fullscreen experience.
    controls: Type commands at the prompt and press Enter to run them. Use the demo link in the viewer header to open the terminal in a new tab for fullscreen use.
    tech:
      - Vanilla JS
      - Web terminal emulation
- name: Motion studio
  category: Simulations
  description: A workbench for tuning Material 3 Expressive motion springs and beziers.
  image: /assets/img/goodies/motion_studio.png
  iframe_url: /goodies/motion-studio/index.html
  info:
    summary: A workbench for Material 3 Expressive motion. Tune a spring or a pair of cubic beziers and watch the curve drive a real app-launch and recents transition, so the numbers can be judged by eye instead of by feel.
    controls: Switch between the Spring Solver and Dual Cubic-Bezier models, drag the parameter handles to shape the motion, then use Clear All to reset the canvas.
    tech:
      - Canvas 2D
      - Vanilla JS

- name: Tamil letters in Malayalam
  category: Demos
  description: An interactive chart mapping every Tamil letter to its Malayalam equivalent, with pronunciation and sound.
  image: /assets/img/goodies/tamil_letters_in_malayalam.png
  iframe_url: /goodies/tamil-letters-in-malayalam/index.html
  info:
    summary: A reference chart for anyone moving between Tamil and Malayalam. Every vowel, consonant, vowel-consonant and Grantha letter is shown side by side with its Malayalam counterpart, transliteration and IPA, plus an example word. Tap a cell to hear it spoken.
    controls: Tap any letter cell to open its details and play its sound. Use the Print Chart button to print the whole chart. The credit button links to the author.
    tech:
      - Vanilla JS
      - Web Speech API
